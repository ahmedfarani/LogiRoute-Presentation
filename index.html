<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ByteBloom Academy – Binary Knights</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#0A1328;--pn:rgba(255,255,255,.06);--ln:rgba(255,255,255,.14);--tx:#EAF1F8;--mu:#9FB0CC;--ind:#5B6BD0;--az:#2E9BC6;--lf:#8FD14F;--g:linear-gradient(120deg,#3B4BB0,#2E9BC6 55%,#8FD14F);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--tx);font:500 16px/1.4 'JetBrains Mono',ui-monospace,monospace;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
body:before{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(900px 500px at 85% 0,rgba(46,155,198,.22),transparent),radial-gradient(800px 500px at 0 100%,rgba(59,75,176,.3),transparent);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lf);outline-offset:3px}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;z-index:6;pointer-events:none}
header img{height:44px;background:#fff;border-radius:12px;padding:4px}
main{position:fixed;inset:72px 0 0;z-index:2}
.scene{position:absolute;inset:0;padding:10px 5vw 110px;display:flex;flex-direction:column;justify-content:center;opacity:0;visibility:hidden;transform:scale(.97);transition:opacity .5s,transform .6s,visibility 0s .6s}
.scene.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s .15s,transform .7s .15s}
#cap{position:fixed;left:5vw;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:baseline;gap:16px;font-family:'Bricolage Grotesque',sans-serif;pointer-events:none}
#cap b{font-size:clamp(54px,8vw,110px);font-weight:800;line-height:.8;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#cap span{font-size:clamp(22px,3vw,38px);font-weight:600}#cap small{font:500 14px 'JetBrains Mono';color:var(--mu)}
#dots{position:fixed;right:5vw;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;align-items:center}
#dots button{width:12px;height:12px;border-radius:6px;border:0;background:var(--ln);transition:all .4s}
#dots button[aria-current=true]{width:42px;background:var(--g)}
.arr{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:var(--pn);display:grid;place-items:center}
#wipe{position:fixed;inset:0;z-index:20;background:var(--g);transform:scaleX(0);transform-origin:left;pointer-events:none;transition:transform .45s cubic-bezier(.7,0,.3,1)}
#wipe.in{transform:scaleX(1)}#wipe.out{transform-origin:right}
.seg{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.seg button,.go{border:1px solid var(--ln);background:var(--pn);border-radius:999px;padding:9px 20px;transition:all .25s;backdrop-filter:blur(6px)}
.seg button[aria-pressed=true],.go.hot{background:var(--tx);color:var(--ink);border-color:var(--tx)}
.go:hover,.seg button:hover{border-color:var(--lf)}
.glass{background:var(--pn);border:1px solid var(--ln);border-radius:24px;backdrop-filter:blur(10px)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
h1{font:800 clamp(48px,9vw,128px)/.9 'Bricolage Grotesque',sans-serif;letter-spacing:-.04em}
/* cover */
.cover{align-items:center;text-align:center}
.crest{position:relative;width:min(320px,42vh);aspect-ratio:.82;margin:0 auto 24px}
.crest:before,.crest:after{content:"";position:absolute;inset:-26px;border-radius:50%;border:1px dashed rgba(143,209,79,.5);animation:spin 30s linear infinite}
.crest:after{inset:-56px;border-color:rgba(46,155,198,.4);animation-direction:reverse;animation-duration:45s}
.crest div{position:absolute;inset:0;background:#fff;border-radius:999px 999px 28px 28px;display:grid;place-items:center;padding:12% 10% 6%;box-shadow:0 0 90px rgba(46,155,198,.45);z-index:1}
.crest img{width:100%}
@keyframes spin{to{transform:rotate(360deg)}}
.cover h1{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:clamp(44px,8vw,104px)}
.roster{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.roster button{border:1px solid var(--ln);background:var(--pn);border-radius:999px;padding:8px 18px}
.roster button:hover{border-color:var(--lf);transform:translateY(-3px)}
/* vision */
#vc{width:100%;height:100%;display:block}
.vbox{position:relative;flex:1;min-height:300px}
/* arch */
.arch{flex-direction:row;align-items:center;justify-content:space-around;gap:20px}
.s3d{perspective:1500px;flex:1;display:grid;place-items:center;min-height:380px}
.stack{--g:.12;position:relative;width:min(420px,70vw);height:260px;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-38deg);transition:--g 1s}
.slab{position:absolute;inset:0;border-radius:22px;transform:translateZ(calc(var(--i)*var(--g)*74px));transition:transform .9s cubic-bezier(.2,.8,.2,1),box-shadow .3s;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;font:800 40px 'Bricolage Grotesque';color:#fff;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset;opacity:.94}
.slab:hover{transform:translateZ(calc(var(--i)*var(--g)*74px + 30px))}
.slab[data-on=true]{box-shadow:0 0 0 3px #fff inset,0 0 60px var(--c2)}
.pk{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:#fff;box-shadow:0 0 22px var(--lf);transform-style:preserve-3d;animation:ride 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes ride{0%{transform:translate3d(var(--x),var(--y),calc(var(--a)*var(--g)*74px));opacity:0}15%,85%{opacity:1}100%{transform:translate3d(var(--x),var(--y),calc(var(--b)*var(--g)*74px));opacity:0}}
.side{width:min(260px,30vw);display:flex;flex-wrap:wrap;gap:8px;align-content:center}
.chip{border:1px solid var(--ln);background:var(--pn);border-radius:999px;padding:6px 14px;animation:pop .4s both;animation-delay:var(--d,0s)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
/* quality */
.qwrap{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:center}
.bars{padding:28px;min-height:300px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.bar{height:16px;border-radius:8px;background:rgba(255,255,255,.28);width:var(--w);margin-left:var(--m);transition:all .7s cubic-bezier(.7,0,.3,1);transform-origin:left}
.bars.after .bar:nth-child(n+3){transform:scaleY(0);opacity:0;height:0;margin-top:-12px}
.bars.after .bar:nth-child(1){--w:62%;background:var(--lf)}.bars.after .bar:nth-child(2){--w:36%;--m:0;background:var(--az)}
.code{padding:0;overflow:hidden}.code .hd{display:flex;gap:7px;align-items:center;padding:12px 16px;background:rgba(255,255,255,.05)}.code .hd i{width:11px;height:11px;border-radius:50%;background:var(--ln)}.code .hd span{margin-left:auto;font-size:12px;color:var(--mu)}
.cb{padding:14px 0;min-height:290px;font-size:clamp(11px,1.2vw,15px);overflow-x:auto}
.cl{display:flex;gap:14px;padding:3px 18px;white-space:pre;border-left:3px solid transparent;animation:lin .4s both;animation-delay:var(--d)}
@keyframes lin{from{transform:translateX(-14px);opacity:0}}
.cl em{font-style:normal;color:rgba(255,255,255,.3);width:18px;text-align:right;flex:none}
.cl.bad{background:rgba(235,90,90,.16);border-left-color:#eb5a5a}.cl.good{background:rgba(143,209,79,.16);border-left-color:var(--lf)}
.kw{font-style:normal;color:#C792EA}.ty{font-style:normal;color:#6CC4E8}.cn{font-style:normal;color:#F2C46D}
@keyframes float{50%{transform:translateY(-8px)}}
.num div.pkg{display:flex;align-items:center;gap:16px;transition:box-shadow .4s}.pkg img{height:64px;animation:float 3s ease-in-out infinite}.num .pkg b{display:inline-block}.pkg.ping{box-shadow:0 0 0 3px var(--lf),0 0 50px var(--lf)}
.kn .pc{width:calc(64px + var(--w)*16px);height:132px;padding:10px 6px;justify-content:space-between}
.pc .pv{flex:1;display:flex;align-items:flex-end;justify-content:center;width:100%}
.pc .pv img{width:auto;max-width:100%;height:70px;margin:0;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.box{display:block;position:relative;width:calc(26px + var(--s)*8px);height:calc(24px + var(--s)*6px);border-radius:6px;background:linear-gradient(160deg,#DDB67F,#B98C54);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.box:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22%;margin-left:-11%;background:rgba(255,255,255,.55)}
.box b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:#12214A;z-index:1;text-shadow:0 0 4px #fff}
.road{height:155px}
.load{position:absolute;left:3%;bottom:36px;width:68%;display:flex;align-items:flex-end;gap:6px}
.load>*{animation:pop .4s;flex:none}
.load img{height:76px;width:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.kn .pc{width:calc(78px + var(--w)*16px)}
.pc .pv{align-items:center}
.un{display:grid;grid-template-columns:repeat(var(--c),34px);gap:2px;justify-content:center;align-items:end}
.pc .pv .un img,.load .un img{width:34px;height:auto;max-width:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.load{gap:10px}
.grp{position:relative;padding:8px 6px 2px;border:2px dashed rgba(255,255,255,.35);border-radius:12px}
.grp em{position:absolute;top:-11px;left:8px;font-style:normal;font-size:12px;font-weight:600;background:var(--lf);color:#12214A;border-radius:10px;padding:0 8px}
.pipe{position:relative;display:flex;justify-content:space-between;padding:60px 30px}
.pipe:before{content:"";position:absolute;left:50px;right:50px;top:84px;height:4px;background:var(--ln);border-radius:2px}
.pipe i{position:absolute;left:50px;top:84px;height:4px;width:0;background:var(--g);border-radius:2px;transition:width .5s}
.nd{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;background:var(--ink);border:3px solid var(--ln);display:grid;place-items:center;transition:all .4s}
.nd svg{width:26px;fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.nd.p{background:var(--lf);border-color:var(--lf);box-shadow:0 0 30px var(--lf);transform:scale(1.15)}.nd.p svg{animation:draw .4s .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.nd small{position:absolute;top:70px;font-size:12px;color:var(--mu);white-space:nowrap}
#kc{text-align:center;font:800 54px 'Bricolage Grotesque';margin-top:-10px;height:60px}
/* algos */
.viz{padding:20px;display:block;overflow:auto}
svg text{font-family:'JetBrains Mono',monospace}
.pf{stroke-dasharray:12 8;animation:dash .8s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}
.badge{display:inline-block;font:800 56px 'Bricolage Grotesque';padding:2px 28px;border-radius:18px;color:#fff}
.kn{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:end}
.parcels{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.pc{position:relative;width:calc(44px + var(--w)*24px);height:96px;border-radius:14px;border:2px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 4px;transition:all .3s}
.pc img{width:88%;margin-bottom:4px}.pc b{font-size:18px}.pc i{font-style:normal;color:var(--lf);font-size:13px}
.pc:hover{transform:translateY(-6px);border-color:var(--lf)}.pc.in{opacity:.25;transform:scale(.9)}
.cap{display:flex;gap:4px;margin:10px 0}.cap span{flex:1;height:12px;border-radius:4px;background:var(--ln);transition:background .3s}.cap span.f{background:var(--g)}
.road{position:relative;height:130px;border-bottom:3px solid var(--ln);overflow:hidden}
.tk{position:absolute;left:0;bottom:14px;width:100%;height:100px}
.tk.drive{animation:go 3.4s ease-in-out}
@keyframes go{40%{transform:translateX(35%)}60%{transform:translateX(35%)}100%{transform:translateX(0)}}
.bed{position:absolute;left:0;bottom:22px;width:72%;height:14px;background:#fff;border-radius:4px;display:flex;align-items:flex-end;gap:4px;padding:0}
.bed div{position:absolute;bottom:14px;width:46px;height:46px;border-radius:8px;background:var(--g);display:grid;place-items:center;font-weight:600;color:#fff;animation:pop .4s}
.bed img{position:absolute;bottom:14px;width:70px;animation:pop .4s}
.cab{position:absolute;left:74%;bottom:22px;width:26%;height:62px;background:var(--g);border-radius:10px 24px 6px 6px}
.wh{position:absolute;bottom:4px;width:28px;height:28px;border-radius:50%;background:var(--ink);border:6px solid #fff;animation:spin .6s linear infinite}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
table{border-collapse:collapse;font-size:13px;margin:auto}td,th{border:1px solid var(--ln);padding:5px 9px;text-align:center}td.k{background:var(--lf);color:var(--ink)}
/* live */
.live{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:stretch}
.term{background:#050B1A;border:1px solid var(--ln);border-radius:20px;overflow:hidden;box-shadow:0 0 80px rgba(46,155,198,.2)}
.term .bar2{display:flex;gap:7px;padding:12px 16px;background:#0F1B36}.term .bar2 i{width:11px;height:11px;border-radius:50%;background:var(--ln)}
pre{padding:18px;min-height:300px;max-height:46vh;overflow:auto;white-space:pre-wrap;color:#DDE7F5}
.ok{color:var(--lf)}.dm{color:var(--mu)}.hl{color:#6CC4E8}
.num{display:grid;gap:10px}.num div{padding:14px 22px;border-radius:20px}.num b{display:block;font:800 clamp(40px,5vw,66px)/1 'Bricolage Grotesque'}.num span{color:var(--mu);font-size:13px}
.tiles{display:flex;gap:10px}.tiles div{flex:1;text-align:center;padding:12px;border-radius:18px}
.tiles svg{width:38px;fill:none;stroke:var(--lf);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:860px){.arch,.live,.qwrap,.kn{grid-template-columns:1fr;flex-direction:column}.side{width:100%}#cap small{display:none}.scene{overflow-y:auto;justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const TEAM=[{name:'Kamal',role:'Vision'},{name:'Fatima',role:'Architecture'},{name:'Tariq',role:'Quality'},{name:'Ibrahim',role:'Algorithms'},{name:'Ahmad',role:'Live'}];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],sleep=t=>new Promise(r=>setTimeout(r,t));
const sc=$$('.scene');let cur=-1,lock=false;
$('#roster').innerHTML=TEAM.map((t,i)=>`<button data-i="${i+1}">${t.name}</button>`).join('');
$('#dd').innerHTML=sc.map((_,i)=>`<button data-i="${i}" aria-label="${i?TEAM[i-1].name:'Intro'}"></button>`).join('');
async function go(i,first){i=Math.max(0,Math.min(sc.length-1,i));if(i===cur||lock)return;lock=true;const w=$('#wipe');
 if(!first){w.className='in';await sleep(460)}
 sc.forEach((s,k)=>s.classList.toggle('on',k===i));cur=i;
 $$('#dd button').forEach((b,k)=>b.setAttribute('aria-current',k===i));
 $('#cap').innerHTML=i?`<b>0${i}</b><span>${TEAM[i-1].role}</span><small>${TEAM[i-1].name}</small>`:'';
 enter(i);try{history.replaceState(null,'','#s'+i)}catch(e){}
 if(!first){w.className='in out';await sleep(50);w.className='out';await sleep(450)}lock=false}
document.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)});
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});
let tx0=0;addEventListener('touchstart',e=>tx0=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx0;if(Math.abs(d)>70)go(cur+(d<0?1:-1))});
function seg(el,items,fn,st=0){el.innerHTML=items.map((t,i)=>`<button aria-pressed="${i===st}">${t}</button>`).join('');const set=i=>{$$('button',el).forEach((b,k)=>b.setAttribute('aria-pressed',k===i));fn(i)};$$('button',el).forEach((b,i)=>b.onclick=()=>set(i));fn(st)}

/* ambient network + vision morph */
const bg=$('#bg'),bx=bg.getContext('2d'),vc=$('#vc'),vx=vc.getContext('2d');let BW,BH;
const BN=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0003,vy:(Math.random()-.5)*.0003}));
function rs(){const d=devicePixelRatio||1;BW=bg.width=innerWidth*d;BH=bg.height=innerHeight*d;const r=vc.parentNode.getBoundingClientRect();vc.width=Math.max(300,r.width);vc.height=Math.max(260,r.height);vT()}
const COL=['#6E7FE0','#4FB6E8','#4BC2B6','#8FD14F'],V={st:2,P:Array.from({length:44},(_,i)=>({x:Math.random()*600,y:Math.random()*300,tx:0,ty:0,l:i%4}))};
function vT(){const W=vc.width,H=vc.height;V.P.forEach((p,i)=>{if(V.st===0){p.tx=W/2-100+(i%8)*28;p.ty=H/2-80+(i/8|0)*28}else if(V.st===1){p.tx=30+Math.random()*(W-60);p.ty=30+Math.random()*(H-60)}else{p.tx=W*.18+(i/4|0)*(W*.64/10);p.ty=H*(.18+.2*p.l)}})}
let fr=0;function tick(){fr++;bx.clearRect(0,0,BW,BH);
 BN.forEach(n=>{n.x=(n.x+n.vx+1)%1;n.y=(n.y+n.vy+1)%1});
 for(let i=0;i<BN.length;i++){const a=BN[i];for(let j=i+1;j<BN.length;j++){const b=BN[j],d=Math.hypot((a.x-b.x)*BW,(a.y-b.y)*BH);if(d<190){bx.strokeStyle=`rgba(46,155,198,${.22*(1-d/190)})`;bx.beginPath();bx.moveTo(a.x*BW,a.y*BH);bx.lineTo(b.x*BW,b.y*BH);bx.stroke()}}bx.fillStyle='rgba(143,209,79,.55)';bx.beginPath();bx.arc(a.x*BW,a.y*BH,2.2,0,7);bx.fill()}
 if(cur===1){const W=vc.width,H=vc.height;vx.clearRect(0,0,W,H);if(V.st===1&&fr%110===0)vT();
  V.P.forEach((p,i)=>{p.x+=(p.tx-p.x)*.07+(V.st===1?Math.sin(fr/6+i)*1.6:0);p.y+=(p.ty-p.y)*.07+(V.st===1?Math.cos(fr/7+i)*1.6:0)});
  V.P.forEach((p,i)=>{let q;if(V.st===1){q=V.P[(i*7+3)%44];vx.strokeStyle='rgba(235,90,90,.4)'}else if(V.st===2){q=V.P[i+4];vx.strokeStyle=COL[p.l]+'88'}else{q=V.P[i+1];vx.strokeStyle='rgba(255,255,255,.18)'}
   if(q&&(V.st!==0||i%8!==7)){vx.beginPath();vx.moveTo(p.x,p.y);vx.lineTo(q.x,q.y);vx.stroke()}
   const nx=V.P[i+1];if(V.st===2&&nx&&nx.l===p.l){vx.strokeStyle=COL[p.l];vx.lineWidth=2;vx.beginPath();vx.moveTo(p.x,p.y);vx.lineTo(nx.x,nx.y);vx.stroke();vx.lineWidth=1}});
  V.P.forEach(p=>{vx.fillStyle=V.st===0?'#EAF1F8':COL[p.l];vx.shadowColor=vx.fillStyle;vx.shadowBlur=14;if(V.st===0)vx.fillRect(p.x-9,p.y-9,18,18);else{vx.beginPath();vx.arc(p.x,p.y,8,0,7);vx.fill()}vx.shadowBlur=0})}
 requestAnimationFrame(tick)}
addEventListener('resize',rs);

/* arch */
const LAY={ui:['CLI','Input','Output'],domain:['Warehouse','Package','Vehicle','Route','Dijkstra','Knapsack','KNN','Use cases','Validators','Interfaces','Strategy','State','Command'],data:['CSV','Supabase','Retry','Fallback'],di:['Koin','Bindings']};
function lay(k){$$('.slab').forEach(n=>n.dataset.on=n.dataset.l===k);$('#layChips').innerHTML=LAY[k].map((x,i)=>`<span class="chip" style="--d:${i*.04}s">${x}</span>`).join('')}
$$('.slab').forEach(s=>s.onclick=()=>lay(s.dataset.l));

/* quality */
const EX=[
 {f:'PackageFilter.kt',b:['fun getHeavyPackages(packages: List<Package>): List<Package> {','!    val result = mutableListOf<Package>()','!    for (p in packages) {','!        if (p.weight > 0) {','!            if (p.weight > LIGHT_LIMIT) {','!                result.add(p)','!            }','!        }','!    }','    return result','}'],a:['fun getHeavyPackages(packages: List<Package>) =','!    packages.filter { it.weight > LIGHT_LIMIT }']},
 {f:'WarehouseValidator.kt',b:['fun isValid(w: Warehouse?): Boolean {','!    if (w != null) {','!        if (w.id.isNotEmpty()) {','!            return true','!        } else {','!            return false','!        }','!    } else {','!        return false','!    }','}'],a:['fun isValid(w: Warehouse?) =','!    w != null && w.id.isNotEmpty()']}];
let qe=0,qs=0;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hlk=s=>esc(s).replace(/\b([A-Z][A-Z_]{2,})\b/g,'<i class="cn">$1</i>').replace(/\b([A-Z][a-z][A-Za-z]*)\b/g,'<i class="ty">$1</i>').replace(/\b(fun|val|for|if|else|return|in|true|null)\b/g,'<i class="kw">$1</i>');
function drawQ(){const e=EX[qe],ls=qs?e.a:e.b;$('#fn').textContent=e.f;
 $('#cb').innerHTML=ls.map((l,i)=>{const f=l[0]==='!',t=f?l.slice(1):l;return `<div class="cl ${f?(qs?'good':'bad'):''}" style="--d:${i*.05}s"><em>${i+1}</em><span>${hlk(t)}</span></div>`}).join('');
 $('#qb').classList.toggle('hot',!qs);$('#qa').classList.toggle('hot',!!qs)}
seg($('#qTabs'),EX.map(e=>e.f.replace('.kt','')),i=>{qe=i;drawQ()},0);
const KR=['Layers','Use case','Validator','invoke','DTO'];
$('#pipe').innerHTML+=KR.map(r=>`<div class="nd"><svg viewBox="0 0 26 26"><path d="M5 13L11 19L21 7"/></svg><small>${r}</small></div>`).join('');
$('#qb').onclick=()=>{qs=0;drawQ()};

 const L=[...load],w=L.reduce((a,i)=>a+KI[i].w,0),v=L.reduce((a,i)=>a+KI[i].v,0);

 <div><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="dm">${w} / ${CAP}</span><b style="font:800 48px 'Bricolage Grotesque';color:${v===13?'#8FD14F':'#EAF1F8'}">${v}</b></div><div class="cap">${Array.from({length:CAP},(_,i)=>`<span class="${i<w?'f':''}"></span>`).join('')}</div>

const ALG=[

 ['KNN',()=>{Q={x:58,y:50};drawN();$('#algCtl').innerHTML=''}]];

 const w=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0],col=s=>SC.find(c=>c[0]===s)[3],X=v=>v*4.6+10,Y=v=>v*3+8;

 <div style="text-align:center"><span class="badge" style="background:${col(w)};color:#0A1328">${w}</span><div class="row">${Object.entries(cnt).map(([s,c])=>`<span class="chip">${s} x ${c}</span>`).join('')}</div></div></div>`;
